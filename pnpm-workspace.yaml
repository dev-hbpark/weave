packages:
  - "packages/*"
  - "apps/*"

# pnpm 11 does not run dependency build scripts unless approved. esbuild (vite's
# bundler) needs its install script to wire up its platform binary.
allowBuilds:
  esbuild: true

# pnpm 11 enforces a `minimumReleaseAge` supply-chain check by default, which
# fetches each package's registry metadata to verify its publish age. The
# vendored agocraft / small-think packages are LOCAL tarballs (not on any
# registry), so that fetch 404s and the whole install fails. Disable the age
# check — it is meaningless for pinned, checked-in tarballs.
minimumReleaseAge: 0

# Vendored-dependency overrides. pnpm 10 reads these from package.json's
# `pnpm.overrides`; pnpm 11 reads them HERE (it ignores the package.json field).
# Kept in BOTH places so either pnpm major works. Paths are relative to this
# workspace root and point at the checked-in tarballs under apps/web/vendor/.
overrides:
  "@small-think/client": "file:apps/web/vendor/small-think/small-think-client-0.1.6.tgz"
  "@agocraft/agent-client": "file:apps/web/vendor/agocraft/agocraft-agent-client-1.0.0-rc.20260611161000.tgz"
  "@agocraft/core": "file:apps/web/vendor/agocraft/agocraft-core-1.0.0-rc.20260609193000.tgz"
  "@agocraft/domain-block-doc": "file:apps/web/vendor/agocraft/agocraft-domain-block-doc-1.0.0-rc.20260602053511.tgz"
  "@agocraft/domain-canvas-design": "file:apps/web/vendor/agocraft/agocraft-domain-canvas-design-1.0.0-rc.20260602053511.tgz"
  "@agocraft/domain-media": "file:apps/web/vendor/agocraft/agocraft-domain-media-1.0.0-rc.20260602053511.tgz"
  "@agocraft/domain-presentation": "file:apps/web/vendor/agocraft/agocraft-domain-presentation-1.0.0-rc.20260602053511.tgz"
  "@agocraft/editor": "file:apps/web/vendor/agocraft/agocraft-editor-1.0.0-rc.20260612200000.tgz"
  "@agocraft/input": "file:apps/web/vendor/agocraft/agocraft-input-1.0.0-rc.20260602053511.tgz"
  "@agocraft/interaction": "file:apps/web/vendor/agocraft/agocraft-interaction-1.0.0-rc.20260602053511.tgz"
  "@agocraft/layout": "file:apps/web/vendor/agocraft/agocraft-layout-1.0.0-rc.20260613230000.tgz"
